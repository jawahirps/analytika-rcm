name: Release

# Automatic updates pipeline: every push to main (and every v* tag) builds a
# versioned Docker image and publishes it to GHCR. If a RENDER_DEPLOY_HOOK_URL
# (or RAILWAY_REDEPLOY_HOOK_URL) secret is configured, the new image is rolled
# out to the pod automatically.

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore Analytika.sln
      - name: Build release
        run: dotnet build Analytika.sln -c Release --no-restore
      - name: Run complete test suite
        run: dotnet test Analytika.sln -c Release --no-build --no-restore

  build-and-push:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger Render deploy hook
        if: ${{ vars.RENDER_DEPLOY_ENABLED == 'true' }}
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

      - name: Trigger Railway redeploy hook
        if: ${{ vars.RAILWAY_DEPLOY_ENABLED == 'true' }}
        run: curl -fsS -X POST "${{ secrets.RAILWAY_REDEPLOY_HOOK_URL }}"

      - name: No deploy hooks configured
        if: ${{ vars.RENDER_DEPLOY_ENABLED != 'true' && vars.RAILWAY_DEPLOY_ENABLED != 'true' && vars.AZURE_DEPLOY_ENABLED != 'true' }}
        run: echo "Image published to GHCR. Set RENDER_DEPLOY_ENABLED / RAILWAY_DEPLOY_ENABLED / AZURE_DEPLOY_ENABLED repo variables (+ secrets) to enable automatic rollout."

  deploy-azure:
    if: ${{ vars.AZURE_DEPLOY_ENABLED == 'true' }}
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          images: ghcr.io/${{ github.repository }}:latest
