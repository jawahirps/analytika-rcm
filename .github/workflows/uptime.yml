name: Bix production uptime

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-health:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check public liveness endpoint
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error \
            --retry 2 --retry-delay 5 --max-time 20 \
            https://bix.ghafservices.com/api/health)"
          STATUS_JSON="$response" python3 - <<'PY'
          import json
          import os

          payload = json.loads(os.environ["STATUS_JSON"])
          assert payload.get("status") == "ok", payload
          assert payload.get("commitSha") not in (None, "", "unknown"), payload
          assert payload.get("version") not in (None, "", "unknown"), payload
          print(json.dumps(payload, indent=2))
          PY

