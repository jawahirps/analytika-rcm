{{- if and (not .Values.database.existingSecret) .Values.database.url -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "analytika.databaseSecretName" . }}
  labels:
    {{- include "analytika.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.database.url | quote }}
{{- else if not .Values.database.existingSecret }}
{{- fail "database: set either database.existingSecret (recommended) or database.url" }}
{{- end -}}
