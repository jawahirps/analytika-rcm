# Default values for the Analytika RCM chart.
# Managed-cloud deployment: external (managed) Postgres, RWX shared volume,
# horizontally-scalable web tier + a single background worker.

nameOverride: ""
fullnameOverride: ""

image:
  repository: ghcr.io/jawahirps/analytika-rcm
  tag: ""            # defaults to .Chart.AppVersion when empty
  pullPolicy: IfNotPresent
imagePullSecrets: []   # e.g. [{ name: ghcr-pull }]

# ─────────────────────────────────────────────────────────────────────────────
# Database — managed/external Postgres.
# The app auto-selects Postgres when DATABASE_URL is present (Modules/DatabaseConfig.cs).
# Provide EITHER an existing secret OR an inline url (inline creates a Secret).
database:
  # Reference a pre-created secret (recommended; e.g. SealedSecret/SOPS/cloud secret store).
  existingSecret: ""        # e.g. "analytika-db"
  existingSecretKey: "DATABASE_URL"
  # Or, if existingSecret is empty and this is set, the chart creates a Secret with it.
  # Format: postgres://user:password@host:5432/dbname   (SslMode=Prefer is applied by the app)
  url: ""

# ─────────────────────────────────────────────────────────────────────────────
# Common (non-secret) configuration rendered into a ConfigMap and shared by all pods.
config:
  aspnetcoreEnvironment: Production
  dbDir: /app/data
  jsonConsoleLogs: true     # structured JSON logs for cloud aggregators
  # StartupMaintenance flags — pods do NOT migrate/seed on boot; the migration job owns schema.
  startupMaintenance:
    migrateOnStartup: false
    runDatabaseSetupOnStartup: false
    createIndexesOnStartup: false
    seedDataOnStartup: false
  # Extra raw env (string map) merged into the ConfigMap, e.g. SMTP host, feature flags.
  extraEnv: {}

# ─────────────────────────────────────────────────────────────────────────────
# Shared RWX storage — DataProtection keyring (encrypts portal credentials),
# generated reports, and portal downloads. MUST be ReadWriteMany so web + worker share it.
sharedStorage:
  enabled: true
  existingClaim: ""                 # set to reuse an existing PVC; otherwise the chart creates one
  storageClassName: ""              # REQUIRED on managed cloud: azurefile-csi | efs-sc | <filestore-rwx>
  accessMode: ReadWriteMany
  size: 20Gi
  mounts:
    data: /app/data                       # DataProtection keys (DB_DIR)
    reports: /app/wwwroot/reports
    downloads: /app/wwwroot/portal-downloads

# ─────────────────────────────────────────────────────────────────────────────
# Web tier (stateless app; all background-job flags off).
web:
  replicaCount: 2
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits:   { cpu: "1",  memory: 1Gi }
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 75
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Background worker (Hangfire server + recurring jobs + pending-downloads). Single replica.
worker:
  enabled: true
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits:   { cpu: "1",  memory: 1Gi }
  nodeSelector: {}
  tolerations: []
  affinity: {}

# One-shot schema migration (Helm pre-install/pre-upgrade hook): runs `dotnet Analytika.dll --migrate`.
migration:
  enabled: true
  backoffLimit: 2
  activeDeadlineSeconds: 600

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  className: nginx
  annotations:
    # App allows up to 3 GB DB uploads (Kestrel MaxRequestBodySize); let the proxy match.
    nginx.ingress.kubernetes.io/proxy-body-size: "3072m"
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: bix.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: analytika-tls
      hosts:
        - bix.example.com

# Probes target the anonymous /healthz endpoint (Program.cs).
probes:
  path: /healthz
  liveness:  { initialDelaySeconds: 20, periodSeconds: 20, timeoutSeconds: 5, failureThreshold: 6 }
  readiness: { initialDelaySeconds: 10, periodSeconds: 10, timeoutSeconds: 5, failureThreshold: 6 }

serviceAccount:
  create: true
  name: ""
  annotations: {}

# fsGroup makes the RWX volume writable by the non-root app user (uid 1000 from the image).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false   # app writes /app/logs; set true only with emptyDir mounts
  capabilities:
    drop: [ALL]

podAnnotations: {}
